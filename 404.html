<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Kekii</title>
<script>
  // GitHub Pages sirve este archivo para enlaces como kekii.app/ibai.
  // Redirige a kekii.app/?c=ibai y la app vuelve a poner el enlace bonito.
  // Con dominio propio (kekii.app/ibai) la app está en la raíz; en github.io va dentro de /kekii/.
  var parts = location.pathname.split('/').filter(Boolean);
  var sub = /\.github\.io$/.test(location.hostname) && parts.length;
  var base = sub ? '/' + parts[0] + '/' : '/';
  var channel = (sub ? parts.slice(1) : parts).join('/').replace(/[^a-zA-Z0-9_]/g, '');
  location.replace(base + (channel ? '?c=' + channel : ''));
</script>
</head>
<body style="font-family:system-ui;background:#0a0a0b;color:#ececee">Cargando…</body>
</html>
