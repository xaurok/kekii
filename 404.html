<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Kekii</title>
<script>
  // GitHub Pages sirve este archivo para enlaces como /kekii/ibai.
  // Redirige a /kekii/?c=ibai y la app vuelve a poner el enlace bonito.
  var parts = location.pathname.split('/').filter(Boolean);
  var base = '/' + (parts.length ? parts[0] + '/' : '');
  var channel = parts.slice(1).join('/').replace(/[^a-zA-Z0-9_]/g, '');
  location.replace(base + (channel ? '?c=' + channel : ''));
</script>
</head>
<body style="font-family:system-ui;background:#0a0a0b;color:#ececee">Cargando…</body>
</html>
