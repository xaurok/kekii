<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mojii</title>
<link rel="manifest" href="manifest.json">
<script src="https://player.twitch.tv/js/embed/v1.js" async></script>
<meta name="theme-color" content="#0a0a0b">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: player + chat side by side on desktop, stacked on phone; chat fills the rest of the screen */
:root{
  --bg:#0a0a0b; --panel:#141416; --fg:#ececee; --muted:#8e8e96; --line:#26262b; --field:#1f1f23;
  --accent:#2fd1a9; --accent-fg:#06221b; --mention:#2e2a14; color-scheme:dark;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--body);display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
header{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.logo{font:800 20px var(--display);letter-spacing:-.02em;margin-right:6px}
.logo b{color:var(--accent)}
input,button{font:inherit;color:inherit}
input{background:var(--field);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{border:1px solid var(--line);background:var(--field);border-radius:8px;padding:8px 12px;cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:700}
#searchBox{position:relative;flex:1 1 110px;min-width:0;display:flex}
#channel{flex:1}
#sugg{position:absolute;top:calc(100% + 4px);left:0;right:0;z-index:20;list-style:none;margin:0;padding:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.6);max-height:320px;overflow-y:auto}
#sugg li{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:7px;cursor:pointer}
#sugg li.active,#sugg li:hover{background:var(--field)}
#sugg img{width:30px;height:30px;border-radius:50%;object-fit:cover;flex:none;background:var(--line)}
#sugg .sn{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sugg .sg{font-size:12px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sugg .txt{display:flex;flex-direction:column;min-width:0;flex:1}
#sugg .live{font-size:13px;color:var(--fg);flex:none;display:flex;align-items:center;gap:5px}
#sugg .live::before{content:"";width:8px;height:8px;border-radius:50%;background:#eb0400}
#sugg .head{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 8px 2px;cursor:default;background:none!important}
#sugg .hint{font-size:12px;color:var(--muted);cursor:default;background:none!important}
#who{display:flex;align-items:center;justify-content:center;width:38px;height:38px;padding:0;border-radius:50%;border:2px solid var(--accent);background:var(--field);overflow:hidden;flex:none;cursor:pointer}
#who.guest{color:var(--muted);border-color:var(--line)}
#who .ini{font:700 16px var(--display);color:var(--accent)}
#who img{width:100%;height:100%;object-fit:cover;display:block}
#who .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
#shareBtn[hidden]{display:none}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:999px;font-size:14px;z-index:50}
#sendAs{font-size:12px;color:var(--muted);padding:6px 10px 0}
#sendAs b{color:var(--accent)}
main{flex:1;display:flex;min-height:0}
#playerWrap{flex:1;background:#000;min-width:0;display:flex;position:relative}
#playerSlot{flex:1;display:flex}
#playerSlot iframe{border:0;width:100%;height:100%}
body.headerHidden header{display:none}
#statusBar{display:flex;align-items:center;gap:6px;padding:4px 6px 4px 12px;border-bottom:1px solid var(--line)}
#status{flex:1;min-width:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconBtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:6px 8px;border-radius:8px;border:0;background:none;color:var(--fg);font-size:13px}
.iconBtn:hover{background:var(--field)}
#hideChatBtn{display:none}
#chatToggle{display:none;position:absolute;right:calc(10px + env(safe-area-inset-right,0px));top:10px;z-index:5;
  align-items:center;gap:8px;padding:9px 14px;border-radius:999px;border:0;background:rgba(0,0,0,.6);color:#fff;font-weight:700;backdrop-filter:blur(6px)}
#chatCol{width:360px;display:flex;flex-direction:column;border-left:1px solid var(--line);background:var(--panel);min-height:0}
#chat{flex:1;overflow-y:auto;padding:6px 12px;overscroll-behavior:contain}
.msg{padding:3px 0;word-wrap:break-word;overflow-wrap:anywhere}
.msg.mention{background:var(--mention);margin:0 -12px;padding:3px 12px}
.msg.sys{color:var(--muted);font-style:italic;font-size:13px}
.name{font-weight:700}
.em{display:inline-block;position:relative;vertical-align:middle;margin:-4px 1px}
.em img{height:28px;display:block}
.em img.zw{position:absolute;inset:0;margin:auto;height:28px}
#paused{display:none;text-align:center;font-size:13px;padding:4px;background:var(--accent);color:var(--accent-fg);cursor:pointer}
form{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
#text{flex:1}
#picker{display:none;flex-direction:column;border-top:1px solid var(--line);max-height:min(300px,45vh)}
#picker.open{display:flex}
.emHead{display:flex;gap:6px;padding:8px 8px 4px}
#emSearch{flex:1;padding:7px 10px}
#emList{overflow-y:auto;padding:0 6px 8px;min-height:0}
.emSec{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 4px 4px}
.emGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:2px}
.emCell{display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 2px;border:0;background:none;border-radius:8px;min-width:0}
.emCell:hover,.emCell:focus-visible{background:var(--field)}
.emCell img{height:32px;max-width:100%;object-fit:contain}
.emCell span{font-size:10px;color:var(--muted);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.emNone{color:var(--muted);font-size:13px;padding:14px 4px;text-align:center}
#setup{display:none;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel);font-size:14px;gap:8px;flex-wrap:wrap;align-items:center}
#setup.open{display:flex}
#setup p{margin:0;flex-basis:100%;color:var(--muted)}
code{font-size:12px;background:var(--bg);padding:1px 4px;border-radius:4px}
@media (max-width:820px){
  main{flex-direction:column}
  #playerWrap{flex:0 0 auto;aspect-ratio:16/9;width:100%}
  #chatCol{width:100%;flex:1;border-left:0}
}
/* Horizontal en el móvil: vídeo grande, chat a la derecha que se puede ocultar (como la app de Twitch) */
@media (orientation:landscape) and (max-height:560px){
  main{flex-direction:row}
  #playerWrap{flex:1;aspect-ratio:auto;height:100%;width:auto}
  #chatCol{width:min(340px,42vw);flex:none;border-left:1px solid var(--line)}
  body.chatHidden #chatCol{display:none}
  #chatToggle{display:flex}
  body:not(.chatHidden) #chatToggle{display:none}
  #hideChatBtn{display:inline-flex}
}

/* ---------- Inicio ---------- */
#home{display:none;flex:1;overflow-y:auto;min-height:0;padding-block:6px 24px}
body.homeView #home{display:block}
body.homeView main{display:none}
.logo{cursor:pointer;background:none;border:0;padding:0;color:var(--fg)}
.homeInner{max-width:1400px;margin:0 auto;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--line);margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none}
@media (max-width:420px){.tab{font-size:16px}.tabs{gap:16px}}
.tab{background:none;border:0;border-radius:0;padding:12px 0 10px;font:600 18px var(--display);color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--fg)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border-radius:999px;padding:7px 14px;background:var(--field);border:1px solid var(--line);font-weight:700;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px 16px}
.card{display:flex;flex-direction:column;gap:10px;cursor:pointer;min-width:0;background:none;border:0;padding:0;text-align:left;border-radius:10px}
.thumb{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:10px;overflow:hidden;background:var(--field)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
.card:hover .thumb img{transform:scale(1.03)}
.badgeLive{position:absolute;top:8px;left:8px;display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.65);color:#fff;font-size:13px;padding:3px 9px;border-radius:999px}
.badgeLive::before{content:"";width:8px;height:8px;border-radius:50%;background:#eb0400}
.viewers{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,.65);color:#fff;font-size:13px;padding:2px 8px;border-radius:6px;font-variant-numeric:tabular-nums}
.meta{display:flex;gap:10px;min-width:0}
.meta img{width:40px;height:40px;border-radius:50%;flex:none;background:var(--field);object-fit:cover}
.metaTxt{min-width:0;display:flex;flex-direction:column;gap:2px}
.cName{font-weight:700;font-size:16px}
.cTitle{color:var(--fg);opacity:.85;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cGame{color:var(--muted);font-size:13px}
.empty{color:var(--muted);text-align:center;padding:40px 16px;display:flex;flex-direction:column;align-items:center;gap:12px}
.more{display:block;margin:20px auto 0}
@media (prefers-reduced-motion:reduce){.thumb img{transition:none}}

/* ---------- Interacción con mensajes ---------- */
.msg{cursor:pointer;border-radius:6px}
.msg:not(.sys):hover{background:var(--field)}
.msg.sel{background:var(--field)}
.replyTo{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:2px}
.replyTo::before{content:"↳ "}
#replyBar{display:flex;align-items:center;gap:8px;padding:6px 10px 0;font-size:13px;color:var(--muted);min-width:0}
#replyBar span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#replyBar b{color:var(--accent)}
#sheetBg{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--panel);border-radius:16px 16px 0 0;border-top:1px solid var(--line);
  max-height:80vh;overflow-y:auto;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:520px;margin:0 auto}
#sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 12px}
.prof{display:flex;gap:12px;align-items:center}
.prof img{width:56px;height:56px;border-radius:50%;object-fit:cover;background:var(--field);flex:none}
.prof .pn{font:700 19px var(--display)}
.prof .pd{font-size:13px;color:var(--muted)}
.bio{font-size:14px;margin:10px 0 0;color:var(--fg);opacity:.85}
.quote{margin:12px 0 4px;padding:8px 10px;background:var(--field);border-radius:8px;font-size:14px;overflow-wrap:anywhere}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.acts button,.acts a{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--fg);text-decoration:none;font-weight:700;font-size:14px}
.acts .primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.hist{margin-top:14px}
.hist h4{margin:0 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.hist .msg{cursor:default;padding:4px 0;font-size:14px}
.hist .msg:hover{background:none}

/* ---------- Actividad ---------- */
.actBtn{position:relative}
.actBadge{position:absolute;top:0;right:0;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:#eb0400;color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;line-height:1}
#activity{position:fixed;inset:0;z-index:55;background:var(--bg);display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#activity[hidden]{display:none}
.actTop{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);background:var(--panel)}
.actTop h2{flex:1;margin:0;font:700 19px var(--display);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.linkBtn{background:none;border:0;color:var(--accent);font-weight:700;font-size:13px;padding:6px}
.actTabs{padding:0 16px;margin:0;background:var(--panel)}
.tbadge{display:inline-block;min-width:18px;padding:0 5px;border-radius:999px;background:#eb0400;color:#fff;font:700 11px/18px var(--body);vertical-align:2px;margin-left:4px}
#actBody{flex:1;overflow-y:auto;min-height:0}
.actList{max-width:720px;margin:0 auto}
.actItem{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;border-radius:0;border-bottom:1px solid var(--line);padding:14px 16px;color:var(--fg)}
.actItem:hover{background:var(--panel)}
.actItem.unread{box-shadow:inset 3px 0 0 var(--accent)}
.actAv{width:42px;height:42px;border-radius:50%;flex:none;background:var(--field);display:flex;align-items:center;justify-content:center;font:700 17px var(--display);color:var(--accent);overflow:hidden}
.actAv img{width:100%;height:100%;object-fit:cover}
.actTxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.actRow{display:flex;gap:8px;align-items:baseline}
.actName{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.actTime{font-size:12px;color:var(--muted);flex:none}
.actMsg{font-size:14px;color:var(--fg);opacity:.85;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.actSub{font-size:12px;color:var(--muted)}
.newWh{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line);max-width:720px;margin:0 auto}
.newWh input{flex:1}
.bubbles{display:flex;flex-direction:column;gap:6px;padding:14px 16px;max-width:720px;margin:0 auto}
.bub{max-width:80%;padding:8px 12px;border-radius:16px;font-size:15px;overflow-wrap:anywhere}
.bub.them{align-self:flex-start;background:var(--field);border-bottom-left-radius:4px}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-fg);border-bottom-right-radius:4px}
.bubTime{font-size:11px;color:var(--muted);align-self:center;padding:6px 0 2px}
#whForm{display:flex;gap:8px;padding:8px 10px;border-top:1px solid var(--line);background:var(--panel)}
#whForm[hidden]{display:none}
#whText{flex:1}
.toastAct{cursor:pointer;max-width:min(92vw,420px);border-radius:14px!important;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actNote{font-size:12px;color:var(--muted);text-align:center;padding:14px 16px 24px;max-width:520px;margin:0 auto}

/* ---------- Historial de usuario ---------- */
.msg.old{opacity:.6}
.histSep{color:var(--muted);font-size:12px;text-align:center;padding:6px 0;border-bottom:1px dashed var(--line);margin-bottom:4px}
.hist .hm{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}
.hist .hm:last-child{border-bottom:0}
.hist .ht{flex:none;width:76px;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;padding-top:2px}
.hist .hx{flex:1;min-width:0;overflow-wrap:anywhere}
.hist .hx .em img{height:24px}
.histMore{width:100%;margin-top:10px}
.histInfo{font-size:12px;color:var(--muted);margin-top:8px}

/* ---------- Emblemas ---------- */
.badges{display:inline-flex;gap:3px;vertical-align:-3px;margin-right:4px}
.badges:empty{display:none}
.badges img{height:18px;width:18px;border-radius:3px}
.profBadges{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.profBadges span{display:inline-flex;align-items:center;gap:6px;background:var(--field);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 4px;font-size:12px}
.profBadges img{width:18px;height:18px}

/* ---------- Explorar categorías ---------- */
.grid.cats{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:20px 12px}
@media (max-width:520px){.grid.cats{grid-template-columns:repeat(3,minmax(0,1fr))}}
.catCard{display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:0;text-align:left;cursor:pointer;min-width:0;color:var(--fg)}
.catArt{aspect-ratio:3/4;max-width:100%;border-radius:8px;overflow:hidden;background:var(--field)}
.catArt img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .25s}
.catCard:hover .catArt img{transform:scale(1.04)}
.catName{font-weight:700;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.catViews{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catViews::before{content:"";width:8px;height:8px;border-radius:50%;background:#eb0400;flex:none}
.catViews:empty{display:none}
.catViews span{min-width:0;overflow:hidden;text-overflow:ellipsis}
#catHead{display:flex;align-items:center;gap:14px;margin-bottom:14px}
#catHead img{width:64px;aspect-ratio:3/4;border-radius:6px;object-fit:cover;background:var(--field)}
#catHead h2{margin:0;font:700 22px var(--display);text-wrap:balance}
#catHead .sub{font-size:13px;color:var(--muted)}
.chipSep{flex:none;width:1px;background:var(--line);margin:4px 2px}
@media (prefers-reduced-motion:reduce){.catArt img{transition:none}}

/* ---------- Cambio de pestaña deslizando ---------- */
@keyframes slideL{from{transform:translateX(40px);opacity:.3}to{transform:none;opacity:1}}
@keyframes slideR{from{transform:translateX(-40px);opacity:.3}to{transform:none;opacity:1}}
.slideL{animation:slideL .22s ease-out}
.slideR{animation:slideR .22s ease-out}
#home,#actBody{touch-action:pan-y}
@media (prefers-reduced-motion:reduce){.slideL,.slideR{animation:none}}

/* ---------- Clips ---------- */
.clipCard{display:flex;flex-direction:column;gap:8px;background:none;border:0;padding:0;text-align:left;cursor:pointer;min-width:0;color:var(--fg)}
.clipThumb{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:10px;overflow:hidden;background:var(--field)}
.clipThumb img{width:100%;height:100%;object-fit:cover;display:block}
.clipDur,.clipViews{position:absolute;bottom:8px;background:rgba(0,0,0,.7);color:#fff;font-size:12px;padding:2px 7px;border-radius:5px;font-variant-numeric:tabular-nums}
.clipDur{right:8px}.clipViews{left:8px}
.clipPlay{position:absolute;inset:0;margin:auto;width:48px;height:48px;border-radius:50%;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}
.clipTitle{font-weight:700;font-size:15px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.clipMeta{font-size:13px;color:var(--muted)}
#clipViewer{position:fixed;inset:0;z-index:56;background:#000;color:#fff}
#clipFeed{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain}
.clipSlide{position:relative;height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;overflow:hidden}
.clipBg{position:absolute;inset:-20px;background-size:cover;background-position:center;filter:blur(24px) brightness(.45)}
.clipFrame{position:relative;width:100%;max-width:min(100%,calc((100vh - 220px) * 16 / 9));aspect-ratio:16/9;background:#000}
.clipFrame img,.clipFrame iframe{position:absolute;inset:0;width:100%;height:100%;border:0;object-fit:cover}
.clipInfo{position:absolute;left:0;right:0;bottom:0;padding:16px 84px calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(transparent,rgba(0,0,0,.75))}
.clipInfo .cb{font:700 19px var(--display);background:none;border:0;color:#fff;padding:0}
.clipInfo .cm{font-size:13px;opacity:.85;margin-top:2px}
.clipInfo .ct{font-size:15px;margin-top:8px;overflow-wrap:anywhere}
.clipInfo .cg{display:inline-block;margin-top:8px;font-size:12px;background:rgba(255,255,255,.15);padding:3px 9px;border-radius:6px}
.clipSide{position:absolute;right:max(10px,env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px;align-items:center}
.clipSide button{background:rgba(0,0,0,.35);border:0;color:#fff;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0}
.clipSide span{font-size:12px;text-align:center;margin-top:-12px}
.clipSide a{background:rgba(0,0,0,.35);color:#fff;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;text-decoration:none}
#clipClose{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));z-index:2;background:rgba(0,0,0,.45);border:0;color:#fff;width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0}

/* ---------- Cabecera del canal ---------- */
#statusBar{padding:6px 6px 6px 10px}
#chanAv{width:34px;height:34px;border-radius:50%;flex:none;border:0;padding:0;background:var(--field);overflow:hidden;cursor:pointer}
#chanAv img{width:100%;height:100%;object-fit:cover;display:block}
#chanAv.live{box-shadow:0 0 0 2px var(--panel),0 0 0 4px #eb0400}
#chanTxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px;background:none;border:0;padding:0;text-align:left;color:var(--fg);cursor:pointer}
#chanName{font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status{flex:none;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
#status .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#eb0400;margin-right:4px;vertical-align:1px}
#chanToggle svg{transition:transform .2s}
body.chanCollapsed #chanToggle svg{transform:rotate(-90deg)}
#chanMore{padding:0 12px 8px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
body.chanCollapsed #chanMore{display:none}
#chanTitle{font-size:13px;line-height:1.35;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
#chanTitle.full{-webkit-line-clamp:unset}
#chanTags{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
#chanTags::-webkit-scrollbar{display:none}
.tagChip{flex:none;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--field);border:1px solid var(--line);color:var(--fg)}
.tagChip.game{border-color:var(--accent);color:var(--accent)}
/* Perfil del canal */
.chanProf .prof img{width:72px;height:72px}
.chanStats{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;font-size:13px;color:var(--muted)}
.chanStats b{color:var(--fg)}
.liveBox{margin-top:12px;padding:10px 12px;background:var(--field);border-radius:10px;display:flex;flex-direction:column;gap:6px}
.liveBox .lb{font-size:12px;font-weight:700;color:#ff4d4d;text-transform:uppercase;letter-spacing:.05em}
.liveBox .lt{font-size:14px;overflow-wrap:anywhere}
.partner{display:inline-flex;vertical-align:middle;margin-left:6px;color:var(--accent)}
@media (prefers-reduced-motion:reduce){#chanToggle svg{transition:none}}

/* ---------- Perfil de canal dentro de la app ---------- */
#profile{position:fixed;inset:0;z-index:54;background:var(--bg);display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#profBody{flex:1;overflow-y:auto;min-height:0}
.pfBanner{height:120px;background:linear-gradient(135deg,#0f3d33,#141416 70%);background-size:cover;background-position:center}
.pfWrap{max-width:900px;margin:0 auto;padding:0 16px 30px}
.pfHead{display:flex;align-items:flex-end;gap:14px;margin-top:-38px}
.pfAv{width:84px;height:84px;border-radius:50%;border:4px solid var(--bg);background:var(--field);object-fit:cover;flex:none}
.pfAv.live{border-color:#eb0400}
.pfName{font:800 22px var(--display);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-bottom:4px}
.pfSub{font-size:13px;color:var(--muted);margin-top:8px}
.pfSub b{color:var(--fg)}
.pfBio{font-size:14px;margin:10px 0 0;max-width:65ch}
.pfLive{display:flex;gap:12px;align-items:center;margin-top:14px;padding:10px;border-radius:12px;background:var(--panel);border:1px solid var(--line);cursor:pointer;width:100%;text-align:left;color:var(--fg)}
.pfLive img{width:128px;aspect-ratio:16/9;border-radius:8px;object-fit:cover;flex:none;background:var(--field)}
.pfLive .t{min-width:0;display:flex;flex-direction:column;gap:3px}
.pfLive .l{font-size:12px;font-weight:700;color:#ff4d4d}
.pfLive .tt{font-size:14px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pfActs{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.pfActs button{flex:1 1 120px}
.pfTabs{margin-top:18px}
.vodCard{display:flex;flex-direction:column;gap:8px;background:none;border:0;padding:0;text-align:left;cursor:pointer;min-width:0;color:var(--fg)}
.schedItem{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.schedDate{flex:none;width:64px;text-align:center;background:var(--panel);border-radius:10px;padding:6px 0}
.schedDate b{display:block;font:800 22px var(--display)}
.schedDate span{font-size:12px;color:var(--muted);text-transform:uppercase}
.schedTxt{min-width:0;display:flex;flex-direction:column;gap:3px}
.schedTxt .st{font-weight:700}
.schedTxt .sm{font-size:13px;color:var(--muted)}
#vodViewer{position:fixed;inset:0;z-index:58;background:#000;color:#fff;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}
#vodTop{display:flex;align-items:center;gap:8px;padding:8px}
#vodTop button{background:rgba(255,255,255,.1);border:0;color:#fff;width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0}
#vodTitle{flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#vodFrame{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
#vodFrame iframe{width:100%;max-height:100%;aspect-ratio:16/9;border:0}

/* ---------- Seguir / Suscribirse ---------- */
.relRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.relBtn{display:flex;align-items:center;justify-content:center;gap:7px;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--field);color:var(--fg);text-decoration:none;font-weight:700;font-size:14px}
.relBtn.on{border-color:var(--accent);color:var(--accent)}
.relBtn.cta{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.relNote{grid-column:1/-1;font-size:12px;color:var(--muted);text-align:center}

/* ---------- Cheers, mensajes destacados y avisos ---------- */
.msg.cheer{background:linear-gradient(90deg,rgba(145,70,255,.18),transparent);border-left:3px solid #9146ff;margin:2px -12px;padding:4px 12px 4px 9px}
.cheerTag{display:block;font-size:11px;font-weight:700;color:#bf94ff;letter-spacing:.03em}
.cheermote{display:inline-flex;align-items:center;gap:2px;vertical-align:middle;font-weight:800}
.cheermote img{height:28px}
.msg.highlighted{background:rgba(47,209,169,.16);border-left:3px solid var(--accent);margin:2px -12px;padding:4px 12px 4px 9px}
.hlTag{display:block;font-size:11px;font-weight:700;color:var(--accent)}
.notice{margin:4px -12px;padding:8px 12px;background:var(--field);border-left:3px solid #bf94ff;font-size:13px}
.notice b{display:block;margin-bottom:2px}
.notice.raid{border-left-color:#ff9f1c}
.notice.announcement{border-left-color:var(--accent)}
#pointsBtn{padding:8px 10px}
.cheerTiers{display:flex;justify-content:space-around;gap:6px;margin:14px 0 4px}
.cheerTiers div{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:14px}
.cheerTiers img{height:40px}
.giftNote{font-size:12px;color:var(--muted);margin-top:8px;text-align:center}

/* ---------- Minirreproductor al volver al inicio ----------
   Nada puede quedar encima del vídeo ni encogerlo con transform: durante el anuncio inicial
   Twitch comprueba que el reproductor se vea entero y, si no, lo pausa. */
#miniBar{display:none}
body.homeView.mini main{display:flex;flex:0 0 0;min-height:0;overflow:visible}
body.mini #chatCol{display:none}
body.mini{--miniW:min(56vw,330px)}
body.mini #playerWrap{position:fixed;z-index:50;right:max(6px, env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));
  width:var(--miniW);height:calc(var(--miniW) * 9 / 16 + 36px);aspect-ratio:auto;flex:none;border-radius:12px;overflow:hidden;
  box-shadow:0 0 0 1px var(--line),0 10px 30px rgba(0,0,0,.65);border:0;touch-action:none;cursor:pointer;display:block;background:#000}
body.mini #playerSlot iframe{pointer-events:none}
body.mini #playerSlot{position:absolute;left:0;top:0;width:100%;height:calc(var(--miniW) * 9 / 16);flex:none}
body.mini #chatToggle{display:none!important}
body.mini #home{padding-bottom:calc(var(--miniW) * 9 / 16 + 60px)}
body.mini #miniBar{display:flex;align-items:center;gap:6px;position:absolute;left:0;right:0;bottom:0;height:36px;padding:0 4px 0 10px;background:var(--panel);color:var(--fg)}
#miniName{flex:1;min-width:0;font-weight:700;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#miniName .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#eb0400;margin-right:6px;vertical-align:1px}
#miniClose{flex:none;width:30px;height:30px;border-radius:50%;border:0;padding:0;display:flex;align-items:center;justify-content:center;background:var(--field);color:var(--fg)}
body.mini #playerWrap.dragging{transition:none;opacity:.9}

/* ---------- Pestañas del selector de emotes ---------- */
#emTabs{display:flex;gap:4px;padding:0 8px 6px;overflow-x:auto;scrollbar-width:none;flex:none}
#emTabs::-webkit-scrollbar{display:none}
.emTab{flex:none;display:flex;align-items:center;gap:6px;padding:6px 11px;border-radius:999px;border:1px solid var(--line);background:none;color:var(--muted);font-size:13px;font-weight:700}
.emTab img{height:18px;width:18px;border-radius:4px;object-fit:cover}
.emTab[aria-selected="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.emTab .n{font-weight:400;opacity:.7;font-size:12px}
#emList{touch-action:pan-y}

/* ---------- Cerrar paneles deslizando hacia abajo ---------- */
#sheet .grab{position:relative}
#sheet .grab::before{content:"";position:absolute;left:-60px;right:-60px;top:-14px;bottom:-14px}
#sheet.dragging{transition:none}
#sheet.closing{transition:transform .2s ease-in}
#sheet.back{transition:transform .2s ease-out}

/* ---------- Deslizar hacia abajo para actualizar (sin recargar la app) ---------- */
html,body,#home{overscroll-behavior-y:contain}
#ptr{height:0;overflow:hidden;display:flex;align-items:flex-end;justify-content:center}
#ptr span{width:34px;height:34px;margin-bottom:8px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--accent)}
#ptr svg{transition:transform .15s}
#ptr.ready svg{transform:rotate(180deg)}
#ptr.loading svg{animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){#ptr.loading svg{animation:none}}

/* ---------- Guía de instalación ---------- */
.instSteps{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:st}
.instSteps li{display:flex;gap:12px;align-items:flex-start;font-size:15px;counter-increment:st}
.instSteps li::before{content:counter(st);flex:none;width:26px;height:26px;border-radius:50%;background:var(--field);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:var(--accent)}
.instSteps b{color:var(--fg)}
.kbd{display:inline-flex;align-items:center;justify-content:center;min-width:24px;height:24px;padding:0 6px;border-radius:6px;background:var(--field);border:1px solid var(--line);font-weight:700;vertical-align:middle}
.instHead{display:flex;gap:12px;align-items:center}
.instHead img{width:52px;height:52px;border-radius:12px;flex:none}
.instNote{font-size:12px;color:var(--muted);margin-top:12px}

/* ---------- Botón ir al directo ---------- */
#liveBtn{color:var(--fg);gap:4px;font-size:11px;font-weight:700}
#liveBtn.behind{color:#ff6b6b}
#liveLag:empty{display:none}


/* ---------- Sugerencias de @menciones ---------- */
#mentionBar{display:flex;gap:6px;overflow-x:auto;padding:8px 10px 2px;scrollbar-width:none}
#mentionBar::-webkit-scrollbar{display:none}
#mentionBar[hidden]{display:none}
.mSug{flex:none;display:flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--field);font-weight:700;font-size:14px}
.mSug.first{border-color:var(--accent)}
.mSug .at{color:var(--muted);font-weight:400}

/* ---------- Acerca de / aviso legal ---------- */
.aboutLink{display:block;width:100%;margin-top:8px;padding:11px;border-radius:10px;font-weight:700;text-align:center}
.legalNote{font-size:12px;color:var(--muted);text-align:center;margin:14px 0 2px;line-height:1.4}
.legalNote a{color:var(--muted)}
.aboutList{margin:12px 0 0;padding-left:18px;font-size:14px;color:var(--fg)}
.aboutList li{margin:4px 0}

/* ---------- Selector de idioma ---------- */
.langRow{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.langLab{font-size:13px;color:var(--muted);margin-right:4px}
.langChip{padding:6px 14px}

/* ---------- Cambiar de pestaña arrastrando (como la app de Twitch) ---------- */
#homePage{will-change:transform}
#homePage.snap{transition:transform .22s cubic-bezier(.2,.8,.2,1)}
.homeInner .tabs{position:relative}
#tabInk{position:absolute;bottom:-1px;height:3px;background:var(--fg);border-radius:2px;pointer-events:none;opacity:0}
.homeInner .tabs.dragging .tab{border-bottom-color:transparent}
.homeInner .tabs.dragging #tabInk{opacity:1}

/* ---------- Deslizar el directo hacia abajo para volver al inicio ---------- */
body.peekHome #home{display:block;position:fixed;inset:0;z-index:0;padding-top:env(safe-area-inset-top,0px)}
body.peekHome main{position:relative;z-index:2;background:var(--bg);border-radius:14px;overflow:hidden;box-shadow:0 -10px 30px rgba(0,0,0,.6)}
main.snap{transition:transform .22s ease-out}
</style>
</head>

    <button id="chatToggle" type="button" aria-label="Mostrar chat"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/><path d="M9 10h.01M12 10h.01M15 10h.01" stroke-linecap="round" stroke-width="2.6"/></svg>Chat</button></div>

function tr(str){
  if(LANG!=='en' || !str) return str;
  const lead=str.match(/^\s*/)[0], trail=str.match(/\s*$/)[0], core=str.trim();
  if(!core) return str;
  if(EN[core]!==undefined) return lead+EN[core]+trail;
  for(const [re,rep] of EN_PATTERNS){ if(re.test(core)) return lead+core.replace(re,rep)+trail; }
  let out=core; for(const [re,rep] of EN_FRAGMENTS) out=out.replace(re,rep);
  return lead+out+trail;
}

// Partes con contenido de otros (mensajes, títulos, biografías, nombres) que nunca se traducen
const NO_TR = '.langChip,.bio,.cTitle,.clipTitle,.ct,#chanTitle,.tagChip,.hx,.bub,.quote,.emCell,.mSug,.cName,.catName,.pn,.sn,#miniName,#chanName,.name,.badges,input,textarea,.cg,.cGame';
function shouldTranslate(node){
  const el = node.nodeType===1 ? node : node.parentElement; if(!el) return false;
  if(el.closest(NO_TR)) return false;
  const msg = el.closest('#chat .msg, .hist .msg'); if(msg && !el.closest('.sys,.replyTo,.cheerTag,.hlTag')) return false;
  const am = el.closest('.actMsg'); if(am) return node.nodeType===3 && /^Tú: /.test(node.data);
  return true;
}
function trNode(root){
  if(LANG!=='en') return;
  if(root.nodeType===3){ if(shouldTranslate(root)){ const t=tr(root.data); if(t!==root.data) root.data=t; } return; }
  if(root.nodeType!==1) return;
  const walk=document.createTreeWalker(root, NodeFilter.SHOW_TEXT|NodeFilter.SHOW_ELEMENT);
  let n=root;
  do{
    if(n.nodeType===3){ if(shouldTranslate(n)){ const t=tr(n.data); if(t!==n.data) n.data=t; } }
    else for(const a of ['placeholder','aria-label','title']){ const v=n.getAttribute && n.getAttribute(a); if(v){ const t=tr(v); if(t!==v) n.setAttribute(a,t); } }
  } while((n=walk.nextNode()));
}
if(LANG==='en'){
  const go=()=>{ trNode(document.body); new MutationObserver(ms=>ms.forEach(m=>{ m.addedNodes.forEach(trNode); if(m.type==='attributes') trNode(m.target); }))
    .observe(document.body,{childList:true,subtree:true,attributes:true,attributeFilter:['placeholder','aria-label','title']}); };
  if(document.body) go(); else addEventListener('DOMContentLoaded', go);
}

function renderText(container, text, twEmotes, cheer){
  // twEmotes: [{start,end,id}] using code point indices
  const cps = [...text]; const parts = []; let pos = 0;
  twEmotes.sort((a,b)=>a.start-b.start).forEach(e=>{
    if(e.start>pos) parts.push({t:cps.slice(pos,e.start).join('')});
    parts.push({tw:e.id, name:cps.slice(e.start,e.end+1).join('')}); pos=e.end+1;
  });
  if(pos<cps.length) parts.push({t:cps.slice(pos).join('')});
  let last = null; // last emote span, for zero-width overlays
  for(const p of parts){
    if(p.tw){ last = emoteNode(`https://static-cdn.jtvnw.net/emoticons/v2/${p.tw}/default/dark/2.0`,p.name); container.appendChild(last); continue; }
    for(const w of p.t.split(/(\s+)/)){
      if(cheer){ const cn=cheerNode(w); if(cn){ container.appendChild(cn); last=null; continue; } }
      const e7 = emotes7.get(w);
      if(e7){
        if(e7.zw && last){ const i=document.createElement('img'); i.src=e7.url; i.className='zw'; i.alt=i.title=w; last.appendChild(i); }
        else { last = emoteNode(e7.url,w); container.appendChild(last); }
      } else if(w){
        if(/\S/.test(w)) last = null;
        container.appendChild(document.createTextNode(w));
      }
    }
  }
}

// ---------- IRC ----------
function parse(line){
  const m = {tags:{}};
  if(line[0]==='@'){ const i=line.indexOf(' ');
    line.slice(1,i).split(';').forEach(kv=>{const j=kv.indexOf('='); const k=kv.slice(0,j); const v=kv.slice(j+1).replace(/\\(.)/g,(x,c)=>({s:' ',':':';',r:'\r',n:'\n','\\':'\\'}[c]??c)); m.tags[k]=v;}); line=line.slice(i+1); }
  if(line[0]===':'){ const i=line.indexOf(' '); m.prefix=line.slice(1,i); line=line.slice(i+1); }
  const ti=line.indexOf(' :'); if(ti>=0){ m.trailing=line.slice(ti+2); line=line.slice(0,ti); }
  const parts=line.split(' '); m.cmd=parts[0]; m.params=parts.slice(1); return m;
}
function parseEmotes(tag){
  if(!tag) return [];
  return tag.split('/').flatMap(g=>{ const [id,r]=g.split(':'); return r.split(',').map(x=>{const [s,e]=x.split('-'); return {id,start:+s,end:+e};}); });
}
function connect(){
  if(ws) { ws.onclose=null; ws.close(); }
  emotes7.clear(); loadGlobal7tv();
  ws = new WebSocket('wss://irc-ws.chat.twitch.tv:443');
  ws.onopen = ()=>{
    ws.send('CAP REQ :twitch.tv/tags twitch.tv/commands');
    ws.send('PASS ' + (token ? 'oauth:'+token : 'SCHMOOPIIE'));
    ws.send('NICK ' + (token && login ? login : 'justinfan'+Math.floor(Math.random()*90000+10000)));
    ws.send('JOIN #'+channel);
    if(!ws.recentLoaded){ ws.recentLoaded=true; loadRecentMessages(channel); }
    if(!chan.user) $('status').textContent = 'Conectado al chat'; else renderChanBar();
  };
  ws.onmessage = ev => ev.data.split('\r\n').filter(Boolean).forEach(l=>{
    const m = parse(l);
    switch(m.cmd){
      case 'PING': ws.send('PONG :'+m.trailing); break;
      case 'ROOMSTATE': if(m.tags['room-id'] && !ws.loaded7){ ws.loaded7=true; roomId=m.tags['room-id']; loadChannel7tv(roomId); loadTwitchEmotes(); loadBadges(); loadCheermotes(); } break;
      case 'PRIVMSG': showMsg(m.tags['display-name']||m.prefix.split('!')[0], m.tags.color, m.trailing||'', parseEmotes(m.tags.emotes),
        {id:m.tags.id, login:m.prefix.split('!')[0], parentName:m.tags['reply-parent-display-name'], parentBody:m.tags['reply-parent-msg-body'], t:+m.tags['tmi-sent-ts']||Date.now(), badges:m.tags.badges, badgeInfo:m.tags['badge-info'], bits:+m.tags.bits||0, msgId:m.tags['msg-id'], reward:m.tags['custom-reward-id']}); break;
      case 'USERNOTICE': showNotice(m); break;
      case 'USERSTATE': me.badges = m.tags.badges; me.badgeInfo = m.tags['badge-info']; me.color = m.tags.color || me.color; me.name = m.tags['display-name'] || me.name; break;
      case 'CLEARCHAT': if(!m.trailing) { chatEl.textContent=''; sys('El chat ha sido borrado por un moderador'); } break;
      case 'NOTICE': sys(m.trailing); break;
    }
  });
  ws.onclose = ()=>{ $('status').textContent='Desconectado, reconectando…'; setTimeout(()=>channel&&connect(),3000); };
}

const chIn = $('channel'), sugg = $('sugg');
let suggItems = [], activeIdx = -1, searchTimer, searchSeq = 0;
function recents(){ try{ return JSON.parse(store.get('tw_recent')||'[]'); }catch(e){ return []; } }
function addRecent(c){ store.set('tw_recent', JSON.stringify([c, ...recents().filter(x=>x!==c)].slice(0,8))); }
function hideSugg(){ sugg.hidden = true; chIn.setAttribute('aria-expanded','false'); activeIdx=-1; }
function li(cls,text){ const l=document.createElement('li'); l.className=cls; l.textContent=text; return l; }
function renderSugg(groups){
  sugg.textContent=''; suggItems=[]; activeIdx=-1;
  for(const g of groups){
    if(!g.items.length) continue;
    if(g.title) sugg.appendChild(li('head', g.title));
    for(const it of g.items){
      const l=document.createElement('li'); l.setAttribute('role','option');
      if(it.img){ const im=document.createElement('img'); im.src=it.img; im.alt=''; l.appendChild(im); }
      const t=document.createElement('span'); t.className='txt';
      const n=document.createElement('span'); n.className='sn'; n.textContent=it.name; t.appendChild(n);
      if(it.sub){ const s=document.createElement('span'); s.className='sg'; s.textContent=it.sub; t.appendChild(s); }
      l.appendChild(t);
      if(it.live){ const b=document.createElement('span'); b.className='live'; b.textContent = it.viewers!=null ? fmtViewers(it.viewers) : 'EN DIRECTO'; l.appendChild(b); }
      l.addEventListener('mousedown', e=>{ e.preventDefault(); pick(it.login); });
      sugg.appendChild(l); suggItems.push({el:l, login:it.login});
    }
  }
  if(groups.hint) sugg.appendChild(li('hint', groups.hint));
  const show = sugg.children.length>0;
  sugg.hidden = !show; chIn.setAttribute('aria-expanded', String(show));
}
function pick(login){ chIn.value = login; hideSugg(); start(); }
function setActive(i){
  if(!suggItems.length) return;
  activeIdx = (i + suggItems.length) % suggItems.length;
  suggItems.forEach((s,k)=>s.el.classList.toggle('active', k===activeIdx));
  suggItems[activeIdx].el.scrollIntoView({block:'nearest'});
}
async function helix(path){
  const r = await fetch('https://api.twitch.tv/helix/'+path,{headers:{'Client-Id':CLIENT_ID, Authorization:'Bearer '+token}});
  if(!r.ok) throw new Error(r.status); return (await r.json()).data || [];
}
function fmtViewers(n){ if(LANG==='en') return fmtK(n); return n>=1000 ? (n/1000).toFixed(n<10000?1:0).replace('.0','').replace('.',',')+' mil' : String(n); }
function score(c,q){
  const l=c.login.toLowerCase(), d=c.name.toLowerCase(); let s=0;
  if(l===q||d===q) s+=1000;
  else if(l.startsWith(q)||d.startsWith(q)) s+=300;
  else if(l.includes(q)||d.includes(q)) s+=250;
  if(c.live) s+=150 + Math.log10((c.viewers||0)+1)*60;
  return s;
}
async function updateSugg(){
  const q = chIn.value.trim().toLowerCase().replace(/^.*twitch\.tv\//,'').replace(/\s+/g,'');
  const rec = recents().filter(c=>c.includes(q)).map(c=>({login:c, name:c}));
  const goTo = q && /^[a-z0-9_]{2,25}$/.test(q) ? [{login:q, name:'Ir a '+q}] : [];
  if(!q){ renderSugg([{title:'Recientes', items:rec}]); return; }
  if(!token){ const g=[{title:'Recientes', items:rec},{title:'', items:goTo}]; g.hint='Inicia sesión para buscar canales de Twitch'; renderSugg(g); return; }
  const seq = ++searchSeq;
  try{
    // Dos búsquedas a la vez: todos los canales y solo los que están en directo
    const enc = encodeURIComponent(q);
    const [all, live] = await Promise.all([
      helix('search/channels?first=50&query='+enc),
      helix('search/channels?first=50&live_only=true&query='+enc).catch(()=>[])
    ]);
    if(seq!==searchSeq) return;
    const map = new Map();
    for(const c of [...live, ...all]) if(!map.has(c.id)) map.set(c.id, {
      id:c.id, login:c.broadcaster_login, name:c.display_name, img:c.thumbnail_url, live:c.is_live,
      sub: c.is_live ? [c.game_name, c.title].filter(Boolean).join(' · ') : (c.game_name ? 'Último: '+c.game_name : 'Canal')});
    let list = [...map.values()];
    // Espectadores de los que están en directo, para ordenar como la app de Twitch
    const liveIds = list.filter(c=>c.live).slice(0,100).map(c=>'user_id='+c.id);
    if(liveIds.length){
      try{ const st = await helix('streams?first=100&'+liveIds.join('&'));
        const v = new Map(st.map(x=>[x.user_id, x.viewer_count])); list.forEach(c=>{ if(v.has(c.id)) c.viewers=v.get(c.id); });
      }catch(e){}
      if(seq!==searchSeq) return;
    }
    list = list.sort((a,b)=>score(b,q)-score(a,q)).slice(0,8);
    const recLeft = rec.filter(r=>!list.some(x=>x.login===r.login)).slice(0,3);
    const go = goTo.filter(g=>!list.some(x=>x.login===q));
    renderSugg([{title:'Recientes', items:recLeft},{title:'Canales', items:list},{title:'', items:go}]);
  }catch(e){ if(seq===searchSeq){ const g=[{title:'Recientes', items:rec},{title:'', items:goTo}]; g.hint='No se pudo buscar ahora mismo'; renderSugg(g); } }
}
chIn.addEventListener('input', ()=>{ clearTimeout(searchTimer); searchTimer=setTimeout(updateSugg, 250); });
chIn.addEventListener('focus', updateSugg);
chIn.addEventListener('blur', ()=>setTimeout(hideSugg,120));
chIn.addEventListener('keydown', e=>{
  if(e.key==='ArrowDown'){ e.preventDefault(); if(sugg.hidden) updateSugg(); else setActive(activeIdx+1); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); setActive(activeIdx-1); }
  else if(e.key==='Escape'){ hideSugg(); }
  else if(e.key==='Enter'){ e.preventDefault(); if(activeIdx>=0) pick(suggItems[activeIdx].login); else { hideSugg(); start(); } }
});

// ---------- Clips ----------
const clipsState = {src: store.get('tw_clipsrc')||'follow', cache:{}, list:[], pushed:false, ignorePop:false, obs:null};
function fmtDur(s){ s=Math.round(s); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
function clipAgo(iso){ const d=(Date.now()-Date.parse(iso))/1000;
  if(d<3600) return 'hace '+Math.max(1,Math.floor(d/60))+' min'; if(d<86400) return 'hace '+Math.floor(d/3600)+' h';
  const days=Math.floor(d/86400); return 'hace '+days+(days===1?' día':' días'); }
async function fetchClips(){
  const key=clipsState.src+'|'+home.lang, c=clipsState.cache[key];
  if(c && Date.now()-c.t<300000) return c.list;
  const since=new Date(Date.now()-7*86400000).toISOString();
  let jobs=[];
  if(clipsState.src==='follow'){
    if(!(me.scopes||[]).includes('user:read:follows')) throw new Error('scope');
    const fol=await helix('channels/followed?first=100&user_id='+me.id);
    jobs=fol.slice(0,25).map(f=>'clips?first=15&started_at='+since+'&broadcaster_id='+f.broadcaster_id);
  } else {
    const games=await helix('games/top?first=12');
    jobs=games.map(g=>'clips?first=25&started_at='+since+'&game_id='+g.id);
  }
  const out=[]; const q=[...jobs];
  const worker=async()=>{ while(q.length){ const j=q.shift(); try{ out.push(...await helix(j)); }catch(e){} } };
  await Promise.all([worker(),worker(),worker(),worker(),worker()]);
  const seen=new Set();
  let list=out.filter(c=>!seen.has(c.id) && seen.add(c.id));
  if(home.lang==='es') list=list.filter(c=>(c.language||'').startsWith('es'));
  list.sort((a,b)=>b.view_count-a.view_count); list=list.slice(0,120);
  // nombres de categoría
  const gids=[...new Set(list.map(c=>c.game_id).filter(Boolean))].slice(0,100);
  if(gids.length){ try{ const gs=await helix('games?'+gids.map(id=>'id='+id).join('&')); const gm=new Map(gs.map(g=>[g.id,g.name])); list.forEach(c=>c.game_name=gm.get(c.game_id)||''); }catch(e){} }
  clipsState.cache[key]={t:Date.now(), list};
  return list;
}
function clipCard(c, i, list){
  const b=document.createElement('button'); b.type='button'; b.className='clipCard';
  const th=document.createElement('div'); th.className='clipThumb';

  const du=document.createElement('span'); du.className='clipDur'; du.textContent=fmtDur(c.duration);
  const vw=document.createElement('span'); vw.className='clipViews'; vw.textContent=fmtK(c.view_count)+' visualizaciones';

  const t=document.createElement('div'); t.className='clipTitle'; t.textContent=c.title;
  const m=document.createElement('div'); m.className='clipMeta'; m.textContent=c.broadcaster_name+' · '+clipAgo(c.created_at)+(c.game_name?' · '+c.game_name:'');
  b.append(th,t,m); b.onclick=()=>{ if(list) clipsState.list=list; openClipViewer(i); };

async function loadClipsTab(){
  homeMsg('Cargando clips…');
  try{
    const list=await fetchClips(); clipsState.list=list; homeMsg('');
    if(!list.length){ homeMsg(clipsState.src==='follow' ? 'No hay clips de esta semana de los canales que sigues'+(home.lang==='es'?' en español.':'.') : 'No hay clips populares'+(home.lang==='es'?' en español':'')+' esta semana.'); return; }
    const grid=$('grid'); list.forEach((c,i)=>grid.appendChild(clipCard(c,i,list)));
  }catch(e){
    homeMsg(e.message==='scope' ? 'Vuelve a iniciar sesión para ver los clips de los canales que sigues.' : 'No se pudieron cargar los clips ahora mismo.', e.message==='scope');

function buildUserHistory(userLogin){
  const h=document.createElement('div'); h.className='hist';

  const local=(userHist.get(userLogin)||[]).slice().reverse();
  title.textContent = local.length ? 'Mensajes en este chat · '+local.length : 'Mensajes en este chat';
  local.forEach(m=>listEl.appendChild(histRow(m)));

        if(!r.ok) throw new Error(r.status===404 ? 'nolog' : 'err');
        months=((await r.json()).availableLogs||[]); idx=0;
        if(!months.length) throw new Error('nolog');
        title.textContent='Historial de @'+userLogin+' en '+ch;
        listEl.textContent='';
      }
      const mo=months[idx++];
      const r=await fetch(`https://logs.ivr.fi/channel/${ch}/user/${userLogin}/${mo.year}/${mo.month}?json&reverse`);
      if(!r.ok) throw new Error('err');

      const label=document.createElement('div'); label.className='histSep';
      label.textContent=new Date(+mo.year, +mo.month-1, 1).toLocaleDateString(LOC,{month:'long',year:'numeric'})+' · '+msgs.length+' mensajes';
      listEl.appendChild(label);
      msgs.forEach(m=>{
        const t=Date.parse(m.timestamp)||0;
        const tags=m.tags||{};
        listEl.appendChild(histRow({text:m.text, t, emotes:parseEmotes(tags.emotes)}));
      });
      if(idx<months.length){ more.disabled=false; more.textContent='Cargar mes anterior'; }
      else { more.remove(); info.textContent='No hay más historial.'; }
    }catch(e){
      more.remove();
      info.textContent = e.message==='nolog'
        ? 'Este canal no tiene historial público guardado, así que solo se ven los mensajes desde que entraste.'
        : 'No se pudo cargar el historial ahora mismo.';
    }
  };
  return h;
}

function connectEventSub(url){
  if(!canWhisper()) return;
  const w = new WebSocket(url || 'wss://eventsub.wss.twitch.tv/ws');
  let keepTimer, ka=10;
  const keep=()=>{ clearTimeout(keepTimer); keepTimer=setTimeout(()=>w.close(), (ka+10)*1000); };
  w.onmessage = async ev=>{
    let m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
    const type=m.metadata && m.metadata.message_type;
    if(type==='session_welcome'){
      esRetry=0; ka=m.payload.session.keepalive_timeout_seconds||10; keep();
      const old=esWs; esWs=w; if(old && old!==w){ old.onclose=null; old.close(); }
      if(!url){
        try{ await fetch('https://api.twitch.tv/helix/eventsub/subscriptions',{method:'POST',
          headers:{'Client-Id':CLIENT_ID,Authorization:'Bearer '+token,'Content-Type':'application/json'},
          body:JSON.stringify({type:'user.whisper.message',version:'1',condition:{user_id:me.id},transport:{method:'websocket',session_id:m.payload.session.id}})}); }catch(e){}
      }
    } else if(type==='session_keepalive'){ keep(); }
    else if(type==='notification'){
      keep(); const e=m.payload.event; if(!e || !e.whisper) return;
      addWhisper(e.from_user_login, e.from_user_name, e.from_user_id, {from:'them', text:e.whisper.text, t:Date.now()});
      if(!(actOpen() && act.open===e.from_user_login)) toastAction('Susurro de '+e.from_user_name+': '+e.whisper.text, ()=>openActivity('whispers', e.from_user_login));
    } else if(type==='session_reconnect'){ connectEventSub(m.payload.session.reconnect_url); }
  };
  w.onclose = ()=>{ clearTimeout(keepTimer); if(esWs===w || !esWs){ esWs=null; setTimeout(()=>connectEventSub(), Math.min(60000, 2000*2**esRetry++)); } };

async function sendWhisper(loginTo, text){
  const c=whispers[loginTo]; let id=c&&c.id, name=c&&c.name;
  if(!id){ const u=(await helix('users?login='+encodeURIComponent(loginTo)))[0]; if(!u) throw new Error('No existe ningún usuario llamado '+loginTo); id=u.id; name=u.display_name; }
  const r=await fetch(`https://api.twitch.tv/helix/whispers?from_user_id=${me.id}&to_user_id=${id}`,{method:'POST',
    headers:{'Client-Id':CLIENT_ID,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify({message:text})});
  if(r.status===204){ addWhisper(loginTo, name, id, {from:'me', text, t:Date.now()}); return; }
  let msg=''; try{ msg=(await r.json()).message||''; }catch(e){}
  if(/phone/i.test(msg)) throw new Error('Twitch pide tener el teléfono verificado en tu cuenta para enviar susurros.');
  if(r.status===429) throw new Error('Has enviado demasiados susurros. Espera un poco.');
  if(r.status===403) throw new Error('Este usuario no acepta tus susurros.');
  if(r.status===401) throw new Error('Vuelve a iniciar sesión para poder enviar susurros.');
  throw new Error(msg || 'No se pudo enviar el susurro.');
}

    if(Math.abs(dx)<70 || Math.abs(dx)<Math.abs(dy)*1.8 || Date.now()-t0>700) return;

(()=>{

    if(nb){ const r1=nb.getBoundingClientRect(), f=Math.min(1,Math.abs(frac)); L=r0.left+(r1.left-r0.left)*f; W=r0.width+(r1.width-r0.width)*f; }

// Reproductor con la API oficial de Twitch, para poder reanudarlo si se pausa solo
let tPlayer=null, startGesture=0;
addEventListener('pointerdown', ()=>{ startGesture=Date.now(); }, true);
addEventListener('keydown', ()=>{ startGesture=Date.now(); }, true);
function createPlayer(c){
  // El directo espera a tu toque en el play del reproductor (los que arrancan solos se pausan al
  // cambiar de tamaño). Al empezar, si va por detrás, saltamos solos al momento actual.
  const slot=$('playerSlot'); slot.innerHTML=''; tPlayer=null;
  const createdAt=Date.now(); let firstPlay=true;
  const fallback=()=>{ slot.innerHTML=`<iframe allowfullscreen allow="autoplay; fullscreen; picture-in-picture" src="https://player.twitch.tv/?channel=${encodeURIComponent(c)}&parent=${location.hostname}&autoplay=false&muted=false"></iframe>`; };
  const make=()=>{
    if(c!==channel) return;
    if(!(window.Twitch && Twitch.Player)){ fallback(); return; }
    try{
      const origCreate=document.createElement;
      document.createElement=function(tag, ...rest){ const el=origCreate.call(document, tag, ...rest);
        if(String(tag).toLowerCase()==='iframe') el.setAttribute('allow','autoplay; fullscreen; picture-in-picture'); return el; };
      try{ tPlayer=new Twitch.Player('playerSlot',{channel:c, parent:[location.hostname], width:'100%', height:'100%', muted:false, autoplay:false}); }
      finally{ document.createElement=origCreate; }
      tPlayer.addEventListener(Twitch.Player.PLAYING, ()=>{
        if(!firstPlay || c!==channel) return; firstPlay=false;
        // Comprobamos el retraso un momento después de empezar y, si hace falta, saltamos al directo
        setTimeout(()=>{
          if(c!==channel || !tPlayer) return;
          let lag=null; try{ const st=tPlayer.getPlaybackStats(); lag=st && (st.hlsLatencyBroadcaster ?? st.broadcasterLatency); }catch(e){}
          const waited=(Date.now()-createdAt)/1000;
          if((lag!=null && lag>4) || (lag==null && waited>8)) jumpLive(true);
        }, 1500);
      });
    }catch(e){ tPlayer=null; fallback(); }
  };
  if(window.Twitch && Twitch.Player) make();
  else { let n=0; const t=setInterval(()=>{ if((window.Twitch && Twitch.Player) || ++n>30){ clearInterval(t); make(); } },100); }
}
// Saltar al momento actual: Twitch solo recarga el canal si está pausado
function jumpLive(silent){
  if(!tPlayer){ if(channel) createPlayer(channel); return; }
  if(!silent) toast('Saltando al directo…');
  try{ tPlayer.pause(); }catch(e){}
  setTimeout(()=>{ try{ tPlayer.setChannel(channel); }catch(e){} }, 250);
  [900, 1800, 3000].forEach(ms=>setTimeout(()=>{ try{ if(tPlayer && tPlayer.isPaused()) tPlayer.play(); }catch(e){} }, ms));
}
// Al encoger o ampliar la ventana, Chrome puede pausar un vídeo que arrancó solo: lo reanudamos
let lastResize=0, wasPausedBefore=false;
function keepPlaying(){
  lastResize=Date.now();
  if(!tPlayer) return;
  let was=false; try{ was=!tPlayer.isPaused(); }catch(e){ return; }
  wasPausedBefore=!was;
  if(!was) return;
  [250, 800, 1600, 3000].forEach(ms=>setTimeout(()=>{ try{ if(tPlayer && tPlayer.isPaused() && channel) tPlayer.play(); }catch(e){} }, ms));
}

(()=>{
  const wrap=$('playerWrap'); let sx=0, sy=0, ox=0, oy=0, moved=false, down=false;
  const isMini=()=>document.body.classList.contains('mini');
  wrap.addEventListener('pointerdown', e=>{ if(!isMini() || e.target.closest('#miniClose')) return;
    down=true; moved=false; sx=e.clientX; sy=e.clientY; const r=wrap.getBoundingClientRect(); ox=r.left; oy=r.top; try{ wrap.setPointerCapture(e.pointerId); }catch(_){} });
  wrap.addEventListener('pointermove', e=>{
    if(!down) return; const dx=e.clientX-sx, dy=e.clientY-sy;
    if(!moved && Math.hypot(dx,dy)<8) return; moved=true; wrap.classList.add('dragging');
    const r=wrap.getBoundingClientRect();
    const x=Math.min(Math.max(4, ox+dx), innerWidth-r.width-4), y=Math.min(Math.max(4, oy+dy), innerHeight-r.height-4);
    wrap.style.left=x+'px'; wrap.style.top=y+'px'; wrap.style.right='auto'; wrap.style.bottom='auto';
  });
  const end=()=>{ down=false; wrap.classList.remove('dragging'); };
  wrap.addEventListener('pointerup', end); wrap.addEventListener('pointercancel', end);
  // Ampliar en 'click' y tragarse el toque, para que no "atraviese" y abra un usuario del chat
  wrap.addEventListener('click', e=>{
    if(!isMini() || e.target.closest('#miniClose')) return;
    e.preventDefault(); e.stopPropagation(); if(moved){ moved=false; return; }
    const until=Date.now()+500;
    const swallow=ev=>{ if(Date.now()<until){ ev.stopPropagation(); ev.preventDefault(); } };
    document.addEventListener('click', swallow, true); setTimeout(()=>document.removeEventListener('click', swallow, true), 600);
    expandMini();
  });
})();

async function relationStatus(u){
  const r={follow:null, followedAt:null, tier:null};
  if(!token || !me.id) return r;
  try{
    if((me.scopes||[]).includes('user:read:follows')){
      const f=await helix('channels/followed?user_id='+me.id+'&broadcaster_id='+u.id);
      r.follow=f.length>0; if(f[0]) r.followedAt=f[0].followed_at;
    }
  }catch(e){}
  try{
    if((me.scopes||[]).includes('user:read:subscriptions')){
      const res=await fetch('https://api.twitch.tv/helix/subscriptions/user?broadcaster_id='+u.id+'&user_id='+me.id,{headers:{'Client-Id':CLIENT_ID,Authorization:'Bearer '+token}});
      if(res.ok){ const j=await res.json(); r.tier=(j.data[0]||{}).tier||null; } else if(res.status===404) r.tier=false;
    }
  }catch(e){}
  return r;
}

    if(r.follow){ fol.className='relBtn on'; fol.innerHTML=HEART; fol.append(' Siguiendo');
      if(r.followedAt) fol.title='Desde el '+new Date(r.followedAt).toLocaleDateString(LOC,{day:'numeric',month:'long',year:'numeric'}); }

// ---------- Deslizar hacia abajo para cerrar el panel inferior ----------
(()=>{
  const sh=$('sheet'); let y0=null, x0=0, dy=0, t0=0, dragging=false;
  sh.addEventListener('touchstart', e=>{
    if(e.touches.length!==1) return;
    const r=sh.getBoundingClientRect(), y=e.touches[0].clientY;
    // Desde la zona superior (la barrita) o desde cualquier sitio si el panel está arriba del todo
    if(y-r.top>64 && sh.scrollTop>0){ y0=null; return; }
    if(e.target.closest('input, textarea, .chips, #chanTags')){ y0=null; return; }
    y0=y; x0=e.touches[0].clientX; dy=0; t0=Date.now(); dragging=false;
  }, {passive:true});
  sh.addEventListener('touchmove', e=>{
    if(y0===null) return;
    const d=e.touches[0].clientY-y0, dx=e.touches[0].clientX-x0;
    if(!dragging){ if(d<8 || Math.abs(dx)>Math.abs(d)){ if(d<-4) y0=null; return; } dragging=true; sh.classList.add('dragging'); }
    dy=Math.max(0,d); sh.style.transform='translateY('+dy+'px)'; $('sheetBg').style.opacity=String(Math.max(.2, 1-dy/400));
    if(e.cancelable) e.preventDefault();
  }, {passive:false});
  sh.addEventListener('touchend', ()=>{
    if(y0===null) return; y0=null; sh.classList.remove('dragging');
    if(!dragging) return; dragging=false;
    const fast = dy>40 && (dy/(Date.now()-t0))>0.5;
    if(dy>110 || fast){
      sh.classList.add('closing'); sh.style.transform='translateY(100%)';
      setTimeout(()=>{ sh.classList.remove('closing'); sh.style.transform=''; $('sheetBg').style.opacity=''; closeSheet(); }, 200);
    } else {
      sh.classList.add('back'); sh.style.transform=''; $('sheetBg').style.opacity='';
      setTimeout(()=>sh.classList.remove('back'), 220);
    }
  });
})();


// ---------- Deslizar hacia abajo para actualizar el inicio, sin recargar la app (el directo sigue) ----------
(()=>{
  const h=$('home'), ptr=$('ptr'); let y0=null, x0=0, d=0, active=false, busy=false;
  const ICON_REFRESH='<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5"/></svg>';
  const ICON_ARROW=ptr.querySelector('span').innerHTML;
  h.addEventListener('touchstart', e=>{ if(busy || h.scrollTop>0 || e.touches.length!==1 || e.target.closest('.chips')){ y0=null; return; }
    y0=e.touches[0].clientY; x0=e.touches[0].clientX; d=0; active=false; }, {passive:true});
  h.addEventListener('touchmove', e=>{
    if(y0===null) return;
    const dy=e.touches[0].clientY-y0, dx=e.touches[0].clientX-x0;
    if(!active){ if(dy<6 || Math.abs(dx)>dy){ if(dy<0) y0=null; return; } if(h.scrollTop>0){ y0=null; return; } active=true; }
    d=Math.min(110, dy*0.5); ptr.style.height=d+'px'; ptr.classList.toggle('ready', d>=70);
    if(e.cancelable) e.preventDefault();
  }, {passive:false});
  h.addEventListener('touchend', async ()=>{
    if(y0===null) return; y0=null; if(!active) return; active=false; ptr.classList.remove('ready');
    if(d<70){ ptr.style.height='0'; return; }
    busy=true; ptr.style.height='52px'; ptr.classList.add('loading'); ptr.querySelector('span').innerHTML=ICON_REFRESH;

function openInstallGuide(){

  } else {
    step('En Chrome o Edge, busca el icono de <b>instalar</b> <span class="kbd">⊕</span> a la derecha de la barra de direcciones.');
    step('O abre el menú <span class="kbd">⋮</span> y elige <b>Instalar Mojii</b>.');
    step('Confirma con <b>Instalar</b>.');
  }
  sh.appendChild(ol);
  const acts=document.createElement('div'); acts.className='acts';
  if(deferredInstall){
    const b=document.createElement('button'); b.type='button'; b.className='primary'; b.textContent='Instalar ahora';
    b.onclick=async()=>{ const d=deferredInstall; deferredInstall=null; try{ d.prompt(); const r=await d.userChoice; if(r.outcome==='accepted') closeSheet(); }catch(e){} };

  later.onclick=()=>{ store.set('tw_install_later', String(Date.now())); closeSheet(); };

function maybeShowInstallGuide(){
  if(isInstalled()) return;
  const later=+store.get('tw_install_later')||0;
  if(Date.now()-later < 7*86400000) return; // si dijiste "Ahora no", no insistimos en una semana
  setTimeout(()=>{ if(!isInstalled() && $('sheet').hidden) openInstallGuide(); }, 1500);
}

// ---------- Sugerencias al escribir @ en el chat ----------
const chatters = new Map(); // login -> {name, color, last}
function noteChatter(login, name, color){ if(!login) return; chatters.set(login, {name:name||login, color, last:Date.now()}); }
function mentionQuery(){
  const t=$('text'); const pos=t.selectionStart ?? t.value.length;
  const m=/(^|\s)@([\w]*)$/.exec(t.value.slice(0,pos));
  return m ? {q:m[2].toLowerCase(), start:pos-m[2].length-1, end:pos} : null;
}
function updateMentions(){
  const bar=$('mentionBar'); const mq=mentionQuery();
  if(!mq || !channel){ bar.hidden=true; return; }
  const list=[]; const seen=new Set();
  const push=(login,name,color,score)=>{ if(seen.has(login) || login===login0()) return; seen.add(login); list.push({login,name,color,score}); };
  const login0=()=>login;
  if(chan.user) push(chan.user.login, chan.user.display_name, null, 1e15);
  chatters.forEach((c,l)=>push(l,c.name,c.color,c.last));
  const q=mq.q;
  let hits=list.filter(x=>!q || x.login.startsWith(q) || x.name.toLowerCase().startsWith(q));
  if(q) hits=hits.concat(list.filter(x=>!hits.includes(x) && (x.login.includes(q) || x.name.toLowerCase().includes(q))));
  hits.sort((a,b)=>{ const ap=a.login.startsWith(q)?1:0, bp=b.login.startsWith(q)?1:0; return (bp-ap) || (b.score-a.score); });
  hits=hits.slice(0,15);
  bar.textContent='';
  if(!hits.length){ bar.hidden=true; return; }
  hits.forEach((h,i)=>{
    const b=document.createElement('button'); b.type='button'; b.className='mSug'+(i===0?' first':'');
    const at=document.createElement('span'); at.className='at'; at.textContent='@';
    const n=document.createElement('span'); n.textContent=h.name; n.style.color=colorFor(h.name,h.color);
    b.append(at,n);
    b.addEventListener('pointerdown', e=>e.preventDefault()); // que no se cierre el teclado
    b.onclick=()=>applyMention(h.name);
    bar.appendChild(b);
  });
  bar.hidden=false; bar.scrollLeft=0;
}
function applyMention(name){
  const t=$('text'); const mq=mentionQuery(); if(!mq) return;
  const before=t.value.slice(0,mq.start), after=t.value.slice(mq.end);
  const ins='@'+name+' ';
  t.value=before+ins+after.replace(/^\s+/,'');
  const p=(before+ins).length; t.focus(); try{ t.setSelectionRange(p,p); }catch(e){}
  $('mentionBar').hidden=true;
}
$('text').addEventListener('input', updateMentions);
$('text').addEventListener('click', updateMentions);
$('text').addEventListener('blur', ()=>setTimeout(()=>{ if(document.activeElement!==$('text')) $('mentionBar').hidden=true; }, 150));
$('text').addEventListener('keydown', e=>{
  const bar=$('mentionBar'); if(bar.hidden) return;
  if(e.key==='Tab' || e.key==='Enter'){ const f=bar.querySelector('.mSug'); if(f){ e.preventDefault(); e.stopImmediatePropagation(); f.click(); } }
  if(e.key==='Escape') bar.hidden=true;
}, true);

// Deslizar la barra del canal hacia abajo para volver al inicio (sin nada encima del vídeo)
(()=>{
  const m=document.querySelector('main'); let y0=null, x0=0, dy=0, t0=0, active=false;
  const start=e=>{ if(!document.body.classList.contains('watching') || document.body.classList.contains('mini') || e.touches.length!==1) return;
    y0=e.touches[0].clientY; x0=e.touches[0].clientX; dy=0; t0=Date.now(); active=false; };
  const move=e=>{
    if(y0===null) return; const my=e.touches[0].clientY-y0, mx=e.touches[0].clientX-x0;
    if(!active){ if(my<10 || Math.abs(mx)>my){ if(my<-6 || Math.abs(mx)>14) y0=null; return; } active=true; m.classList.remove('snap'); document.body.classList.add('peekHome'); if(!$('grid').childElementCount) loadHome(); }
    dy=Math.max(0,my); m.style.transform='translateY('+dy+'px) scale('+(1-Math.min(dy/innerHeight,1)*0.08)+')';
    if(e.cancelable) e.preventDefault();
  };
  const end=()=>{
    if(y0===null) return; y0=null; if(!active) return; active=false;
    const fast=dy>40 && dy/(Date.now()-t0)>0.5;
    m.classList.add('snap');
    if(dy>innerHeight*0.22 || fast){
      m.style.transform='translateY('+innerHeight+'px) scale(.9)';
      setTimeout(()=>{ m.classList.remove('snap'); m.style.transform=''; document.body.classList.remove('peekHome'); showHome(true); }, 220);
    } else {
      m.style.transform=''; setTimeout(()=>{ m.classList.remove('snap'); document.body.classList.remove('peekHome'); }, 230);
    }
  };
  [$('statusBar')].forEach(el=>{ el.addEventListener('touchstart', start, {passive:true}); el.addEventListener('touchmove', move, {passive:false}); el.addEventListener('touchend', end); el.addEventListener('touchcancel', end); });
})();
